  <style>html,body{margin:0;height:100%;background:#FAF6F0}#sabil-loading{position:fixed;inset:0;background:linear-gradient(180deg,#082A21 0%,#0C3F31 55%,#138A6C 100%)}</style>

<body>
  <!-- Пока приложение загружается — только фон заставки, без значка: значок покажет сама заставка. -->
  <div id="sabil-loading"></div>
  <!-- Безопасные края экрана iPhone (часы сверху, полоска «домой» снизу): приложение узнаёт их через sabilInset(). -->
  <div id="sabil-safe" style="position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)"></div>
  <!-- Короткие звуки (бусина тасбиха): Web Audio — звучит мгновенно на КАЖДОЕ нажатие, звуки могут накладываться. -->
  <script>window.sabilSfx=(function(){var ctx=null,bufs={},urls={};function c(){if(!ctx){var A=window.AudioContext||window.webkitAudioContext;if(!A)return null;ctx=new A();try{if(navigator.audioSession)navigator.audioSession.type="transient";}catch(e){}}return ctx;}function load(id,url){urls[id]=url;var x=c();if(!x||bufs[id])return;fetch(url).then(function(r){return r.arrayBuffer();}).then(function(a){return new Promise(function(ok,no){x.decodeAudioData(a,ok,no);});}).then(function(b){bufs[id]=b;}).catch(function(){});}return{load:load,play:function(id){var x=c();if(!x)return;if(x.state!=="running")x.resume();var b=bufs[id];if(!b){if(urls[id])load(id,urls[id]);return;}var s=x.createBufferSource();s.buffer=b;s.connect(x.destination);s.start(0);}};})();</script>
  <!-- Копия данных файлом: «Поделиться» (iPhone: Сохранить в Файлы) или обычное скачивание; выбор файла. Ничего никуда не отправляется. -->
  <script>window.sabilBackup={copy:async function(text){try{await navigator.clipboard.writeText(text);return true;}catch(e){}var t=document.createElement("textarea");t.value=text;t.setAttribute("readonly","");t.style.cssText="position:fixed;left:0;top:0;opacity:0";document.body.appendChild(t);t.select();t.setSelectionRange(0,text.length);var ok=false;try{ok=document.execCommand("copy");}catch(e){}t.remove();return ok;},save:async function(name,text){var f=null;try{f=new File([text],name,{type:"text/plain"});}catch(e){}if(f&&navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return true;}catch(e){if(e&&e.name==="AbortError")return false;}}var u=URL.createObjectURL(new Blob([text],{type:"text/plain"}));var a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},10000);return true;},pick:function(){return new Promise(function(ok){var i=document.createElement("input");i.type="file";i.accept=".txt,text/plain";i.style.display="none";i.onchange=async function(){var f=i.files&&i.files[0];i.remove();ok(f&&f.size<8000000?await f.text():null);};i.addEventListener("cancel",function(){i.remove();ok(null);});document.body.appendChild(i);i.click();});}};</script>
  <script>window.sabilInset=function(side){var d=document.getElementById("sabil-safe");if(!d)return 0;var v=parseFloat(getComputedStyle(d)["padding-"+side]);return isNaN(v)?0:v;};</script>

  <!-- Работа без интернета: sw.js хранит файлы приложения в телефоне (создаёт tool/web/make_sw.py). -->
  <script>
  (function () {
    if (!('serviceWorker' in navigator)) return;
    var sw = navigator.serviceWorker, kk = false, reloading = false;
    try { kk = (localStorage.getItem('flutter.lang') || '').indexOf('kk') >= 0; } catch (e) {}
    var T = kk
      ? { ready: 'Sabil енді интернетсіз де ашылады', fresh: 'Sabil жаңа нұсқасы дайын', go: 'Жаңарту' }
      : { ready: 'Sabil теперь открывается и без интернета', fresh: 'Готова новая версия Sabil', go: 'Обновить' };
    function note(text, action, fn) {
      var old = document.getElementById('sabil-note'); if (old) old.remove();
      var d = document.createElement('div'); d.id = 'sabil-note';
      d.style.cssText = 'position:fixed;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));max-width:420px;margin:0 auto;z-index:99999;background:#0A3A2C;color:#F7F3E8;border:1px solid #E0A85C;border-radius:16px;padding:12px 16px;font:600 15px -apple-system,Roboto,sans-serif;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.25)';
      var t = document.createElement('span'); t.textContent = text; t.style.flex = '1'; d.appendChild(t);
      if (action) {
        var b = document.createElement('button'); b.textContent = action;
        b.style.cssText = 'background:#F6DFA4;color:#0A3A2C;border:0;border-radius:12px;padding:9px 14px;font:700 15px -apple-system,Roboto,sans-serif';
        b.onclick = function () { d.remove(); fn(); }; d.appendChild(b);
      }
      var x = document.createElement('button'); x.textContent = '×'; x.setAttribute('aria-label', 'Закрыть');
      x.style.cssText = 'background:none;color:#BFD9CE;border:0;font-size:22px;padding:0 2px'; x.onclick = function () { d.remove(); };
      d.appendChild(x); document.body.appendChild(d);
      if (!action) setTimeout(function () { d.remove(); }, 5000);
    }
    var had = !!sw.controller;
    sw.addEventListener('controllerchange', function () { if (had && !reloading) { reloading = true; location.reload(); } had = true; });
    function ask(w) { note(T.fresh, T.go, function () { w.postMessage({ type: 'update' }); }); }
    var reg = null;
    function watch(w) { if (!w) return; w.addEventListener('statechange', function () { if (w.state === 'installed' && sw.controller) ask(w); }); }
    sw.register('sw.js').then(function (r) {
      reg = r;
      // Новая версия уже скачана в прошлый раз — включаем её сразу при запуске.
      if (r.waiting && sw.controller) r.waiting.postMessage({ type: 'update' });
      watch(r.installing); r.addEventListener('updatefound', function () { watch(r.installing); });
    }).catch(function () {});
    var last = Date.now();
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && reg && Date.now() - last > 1800000) { last = Date.now(); reg.update().catch(function () {}); }
    });
    sw.addEventListener('message', function (e) {
      var m = e.data || {};
      if (m.type !== 'offline' || m.part !== 'core' || !m.ok) return;
      try { if (localStorage.getItem('sabil_offline')) return; localStorage.setItem('sabil_offline', '1'); } catch (x) {}
      note(T.ready);
    });
    window.addEventListener('flutter-first-frame', function () {
      if (matchMedia('(display-mode: standalone)').matches && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
      setTimeout(function () {
        var base = document.baseURI;
        var used = performance.getEntriesByType('resource').map(function (r) { return r.name; })
          .filter(function (n) { return n.indexOf(base) === 0; }).map(function (n) { return n.slice(base.length).split('?')[0]; });
        sw.ready.then(function (r) { r.active.postMessage({ type: 'warm', engine: used }); });
      }, 1500);
    });
  })();
  </script>
  <script>window.addEventListener("flutter-first-frame",function(){var l=document.getElementById("sabil-loading");if(l)l.remove();});</script>
