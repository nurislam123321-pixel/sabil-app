  <style>
  #sabil-loading{position:fixed;inset:0;z-index:9999;background:linear-gradient(180deg,#082A21 0%,#0C3F31 55%,#138A6C 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .22s ease-out;will-change:opacity}
  #sabil-loading.off{opacity:0;pointer-events:none}
  #sabil-loading svg{display:block}
  .ss-icon{position:relative;width:136px;height:136px;border-radius:35px;background:linear-gradient(45deg,#0A3A2C,#139072);border:1px solid rgba(246,223,164,.45);box-shadow:0 18px 34px rgba(0,0,0,.32);animation:ss-rise .5s cubic-bezier(.2,.9,.3,1.12) both}
  .ss-iw{position:absolute;left:0;right:0;top:45px;display:flex;justify-content:center}
  .ss-wave{position:absolute;left:24px;top:79px;width:84px;height:24px;overflow:hidden;animation:ss-in .42s .28s cubic-bezier(.5,0,.2,1) both}
  .ss-wave>div{animation:ss-out .42s .28s cubic-bezier(.5,0,.2,1) both}
  .ss-gem{position:absolute;left:107px;top:87px;width:10px;height:10px;animation:ss-gem .34s .62s ease-out both}
  .ss-gem>i{display:block;width:8px;height:8px;margin:1px;background:#F6DFA4;transform:rotate(45deg)}
  .ss-glow{position:absolute;left:92px;top:72px;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle,rgba(246,223,164,.85),rgba(246,223,164,0) 70%);animation:ss-glow .5s .6s ease-out both}
  .ss-word{margin-top:26px;animation:ss-up .34s .36s ease-out both}
  .ss-slogan{margin-top:12px;animation:ss-up .34s .46s ease-out both}
  .ss-kk{display:none!important}
  .kk .ss-kk{display:block!important}.kk .ss-ru{display:none!important}
  .ss-wait .ss-gem{animation:ss-beat 1.1s ease-in-out infinite}
  @keyframes ss-rise{from{opacity:0;transform:translateY(34px) scale(.82)}to{opacity:1;transform:none}}
  @keyframes ss-in{from{transform:translateX(-103%)}to{transform:none}}
  @keyframes ss-out{from{transform:translateX(103%)}to{transform:none}}
  @keyframes ss-gem{0%{opacity:0;transform:scale(0)}60%{opacity:1;transform:scale(1.7)}100%{opacity:1;transform:scale(1)}}
  @keyframes ss-glow{0%{opacity:0;transform:scale(.3)}45%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1.5)}}
  @keyframes ss-up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes ss-beat{0%,100%{opacity:.45;transform:scale(.85)}50%{opacity:1;transform:scale(1.35)}}
  .still *{animation:none!important}.still .ss-glow{opacity:0}
  @media (prefers-reduced-motion:reduce){#sabil-loading *{animation:none!important}.ss-glow{opacity:0}}
  </style>
