<!DOCTYPE html>
<html lang="ru">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/sabil-app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sabil — мусульманское приложение: время намаза, Коран, зикр, қаза, кибла, мечети рядом.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F5E48">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sabil">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Sabil</title>
  <style>html,body{margin:0;height:100%;background:#0A3A2C}#sabil-loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,#1d5a49 0%,#0B3428 45%,#0A3A2C 70%),linear-gradient(180deg,#0A3A2C,#139072)}#sabil-loading img{width:124px;height:124px;border-radius:28px;box-shadow:0 18px 40px rgba(0,0,0,.35);animation:sabil-rise 1.2s ease-out both}@keyframes sabil-rise{from{opacity:0;transform:translateY(24px) scale(.92)}to{opacity:1;transform:none}}</style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Пока приложение загружается — тот же значок, что на заставке, без надписи. -->
  <div id="sabil-loading"><img src="icons/Icon-512.png" alt=""></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>window.addEventListener("flutter-first-frame",function(){var l=document.getElementById("sabil-loading");if(l)l.remove();});</script>
</body>
</html>
